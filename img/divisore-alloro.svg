<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 36" width="100%" height="36">
  <defs>
    <!-- Gradiente Oro Sacro Bizantino -->
    <linearGradient id="laurelGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c69214" stop-opacity="0" />
      <stop offset="20%" stop-color="#c69214" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffd966" stop-opacity="1" />
      <stop offset="80%" stop-color="#c69214" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c69214" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="leafGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="50%" stop-color="#c69214" />
      <stop offset="100%" stop-color="#9a700d" />
    </linearGradient>

    <!-- Foglia singola verso l'alto a sinistra -->
    <path id="leaf-up-left" d="M0,0 C-3,-6 -10,-8 -12,-5 C-13,-2 -6,2 0,0 Z" fill="url(#leafGold)" />
    <!-- Foglia singola verso il basso a sinistra -->
    <path id="leaf-down-left" d="M0,0 C-3,6 -10,8 -12,5 C-13,2 -6,-2 0,0 Z" fill="url(#leafGold)" />
  </defs>

  <!-- Linee orizzontali sfumate alle estremità -->
  <line x1="10" y1="18" x2="65" y2="18" stroke="url(#laurelGold)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="295" y1="18" x2="350" y2="18" stroke="url(#laurelGold)" stroke-width="1.2" stroke-linecap="round" />

  <!-- RAMO SINISTRO (Fusto dell'alloro) -->
  <path d="M70,18 Q125,18 170,18" fill="none" stroke="#c69214" stroke-width="1.5" stroke-linecap="round" />

  <!-- Foglie ramo sinistro -->
  <!-- Coppia 1 (esterna) -->
  <g transform="translate(80,18) scale(0.75)">
    <path d="M0,0 C-4,-6 -12,-7 -14,-4 C-15,-1 -7,2 0,0 Z" fill="url(#leafGold)" />
    <path d="M0,0 C-4,6 -12,7 -14,4 C-15,1 -7,-2 0,0 Z" fill="url(#leafGold)" />
    <circle cx="-1" cy="0" r="1.5" fill="#ffd966" />
  </g>

  <!-- Coppia 2 -->
  <g transform="translate(102,18) scale(0.9)">
    <path d="M0,0 C-4,-7 -14,-8 -16,-5 C-17,-2 -8,2 0,0 Z" fill="url(#leafGold)" />
    <path d="M0,0 C-4,7 -14,8 -16,5 C-17,2 -8,-2 0,0 Z" fill="url(#leafGold)" />
    <circle cx="-2" cy="0" r="1.8" fill="#ffd966" />
  </g>

  <!-- Coppia 3 -->
  <g transform="translate(126,18) scale(1.05)">
    <path d="M0,0 C-5,-8 -16,-9 -18,-5 C-19,-2 -9,2 0,0 Z" fill="url(#leafGold)" />
    <path d="M0,0 C-5,8 -16,9 -18,5 C-19,2 -9,-2 0,0 Z" fill="url(#leafGold)" />
    <circle cx="-2" cy="0" r="2" fill="#ffd966" />
  </g>

  <!-- Coppia 4 (interna) -->
  <g transform="translate(152,18) scale(1.15)">
    <path d="M0,0 C-5,-8 -17,-9 -19,-5 C-20,-2 -9,3 0,0 Z" fill="url(#leafGold)" />
    <path d="M0,0 C-5,8 -17,9 -19,5 C-20,2 -9,-3 0,0 Z" fill="url(#leafGold)" />
    <circle cx="-2" cy="0" r="2.2" fill="#ffd966" />
  </g>

  <!-- RAMO DESTRO (Fusto dell'alloro) -->
  <path d="M190,18 Q235,18 290,18" fill="none" stroke="#c69214" stroke-width="1.5" stroke-linecap="round" />

  <!-- Foglie ramo destro (riflesse specularmente) -->
  <!-- Coppia 4 (interna) -->
  <g transform="translate(208,18) scale(-1.15, 1.15)">
    <path d="M0,0 C-5,-8 -17,-9 -19,-5 C-20,-2 -9,3 0,0 Z" fill="url(#leafGold)" />
    <path d="M0,0 C-5,8 -17,9 -19,5 C-20,2 -9,-3 0,0 Z" fill="url(#leafGold)" />
    <circle cx="-2" cy="0" r="2.2" fill="#ffd966" />
  </g>

  <!-- Coppia 3 -->
  <g transform="translate(234,18) scale(-1.05, 1.05)">
    <path d="M0,0 C-5,-8 -16,-9 -18,-5 C-19,-2 -9,2 0,0 Z" fill="url(#leafGold)" />
    <path d="M0,0 C-5,8 -16,9 -18,5 C-19,2 -9,-2 0,0 Z" fill="url(#leafGold)" />
    <circle cx="-2" cy="0" r="2" fill="#ffd966" />
  </g>

  <!-- Coppia 2 -->
  <g transform="translate(258,18) scale(-0.9, 0.9)">
    <path d="M0,0 C-4,-7 -14,-8 -16,-5 C-17,-2 -8,2 0,0 Z" fill="url(#leafGold)" />
    <path d="M0,0 C-4,7 -14,8 -16,5 C-17,2 -8,-2 0,0 Z" fill="url(#leafGold)" />
    <circle cx="-2" cy="0" r="1.8" fill="#ffd966" />
  </g>

  <!-- Coppia 1 (esterna) -->
  <g transform="translate(280,18) scale(-0.75, 0.75)">
    <path d="M0,0 C-4,-6 -12,-7 -14,-4 C-15,-1 -7,2 0,0 Z" fill="url(#leafGold)" />
    <path d="M0,0 C-4,6 -12,7 -14,4 C-15,1 -7,-2 0,0 Z" fill="url(#leafGold)" />
    <circle cx="-1" cy="0" r="1.5" fill="#ffd966" />
  </g>

  <!-- CENTRO: Nastro / Croce / Stella sacra -->
  <g transform="translate(180,18)">
    <!-- Aura centrale -->
    <circle cx="0" cy="0" r="7" fill="rgba(198,146,20,0.18)" />
    <!-- Rombo / Fiocco dorato -->
    <polygon points="0,-7 5,0 0,7 -5,0" fill="url(#leafGold)" />
    <circle cx="0" cy="0" r="2" fill="#fff" />
  </g>
</svg>
